name: start
description: Starter Arcade application using recommended code generation libraries
version: 1.0.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  arcade: ^1.4.0
  arcade_cache: ^1.4.0
  arcade_cache_redis: ^1.4.0
  arcade_swagger: ^1.4.0
  drift: ^2.31.0
  drift_postgres: ^1.3.1
  envied: ^1.3.2
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  injectable: ^2.7.1
  json_annotation: ^4.9.0
  luthor: ^0.16.0
  meta: ^1.17.0
  postgres: ^3.5.9
  superclass: ^0.8.0

dev_dependencies:
  build_runner: ^2.5.4
  drift_dev: ^2.27.0
  envied_generator: ^1.3.2
  freezed: ^3.2.5
  injectable_generator: ^2.12.0
  json_serializable: ^6.9.5
  lint: ^2.8.0
  luthor_generator: ^0.16.0
  superclass_generator: ^0.8.0
